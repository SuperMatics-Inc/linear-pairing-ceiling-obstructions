name: replay-and-paper
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source manifest
        run: |
          set -euo pipefail
          sha256sum -c MANIFEST.sha256
          sha256sum -c ADMITTED.sha256
          test "$(wc -l < MANIFEST.sha256)" = "$(wc -l < ADMITTED.sha256)"
          total=$(find . -type f -not -path './.git/*' | wc -l)
          test $((total - 2)) -eq "$(wc -l < MANIFEST.sha256)"
          # No review-cycle file ships in the tree; reviews belong to the version
          # history of the repository, not to the released bytes.
          if find . -path ./.git -prune -o -type f -print \
               | grep -iE '/(REVIEW|FIX|SCOPING)[^/]*$|\.(bak|orig|rej)$'; then
            echo 'review-cycle file found in the tree'; exit 1
          fi
      - name: Install pinned replay dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==2.5.5 scipy==1.18.1 mpmath==1.4.1 python-flint==0.9.0
          # sympy 1.14.0 declares mpmath<1.4, but its only runtime use of mpmath is
          # `mpmath` itself, and this suite runs against mpmath 1.4.1; install it
          # without the solver so the pin set above is not silently downgraded.
          python -m pip install --disable-pip-version-check --no-deps sympy==1.14.0
          python -c "import numpy, scipy, sympy, mpmath, flint; print(numpy.__version__, scipy.__version__, sympy.__version__, mpmath.__version__, flint.__version__)"
      - name: Static-mode cumulant replay
        working-directory: records/static-mode
        run: |
          set -euo pipefail
          python -B replay.py | tee replay.out
          grep -qF '"coefficient_majorized_from_below": "1/1148"' replay.out
          grep -qF '"bridge_constant": "1/1200"' replay.out
          grep -qF '"embedded_constant": "1/2400"' replay.out
          # The floating-point diagnostics are platform dependent (3.86e-14 on
          # Windows, 1.78e-14 on Linux), so assert the tolerance, not the digits.
          python - replay.out <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          assert report["status"] == "NUMERICAL", report["status"]
          assert report["exact_constants"]["coefficient_majorized_from_below"] == "1/1148"
          assert report["sum_rule_max_error"] < 1e-12, report["sum_rule_max_error"]
          print("static-mode sum-rule error", report["sum_rule_max_error"])
          PY
      - name: Annealed static-field replay, mutants and independent implementation
        working-directory: records/annealed-static
        run: |
          set -euo pipefail
          python -B replay.py | tee replay.out
          grep -qF 'ALL ANNEALED-STATIC REPLAY CHECKS PASSED.' replay.out
          grep -qF "'combined_g_quarter': '8348/675'" replay.out
          grep -qF "'g_quarter_lead': '248/675'" replay.out
          grep -qF "'max_first_order': '0'" replay.out
          python -B replay.py --all-mutants | tee mutants.out
          grep -qF 'ALL 14 MUTANTS REJECTED.' mutants.out
          python -B independent.py | tee independent.out
          grep -qF 'ALL INDEPENDENT ANNEALED-STATIC CHECKS PASSED.' independent.out
          grep -qF "'combined': '8348/675'" independent.out
      - name: Linear-fresh fixtures, mutants and independent implementation
        working-directory: records/linear-fresh
        run: |
          set -euo pipefail
          python -B replay.py | tee replay.out
          grep -qF 'LINEAR-FRESH replay: ALL FIXTURE CHECKS PASSED; NO PAIRING CEILING CERTIFIED' replay.out
          grep -qF 'auxiliary series in (67/50, 27/20) CERTIFIED, not a ceiling coefficient' replay.out
          python -B replay.py --all-mutants | tee mutants.out
          grep -qF 'ALL 16 GUARDED MUTANTS REJECTED' mutants.out
          python -B independent.py | tee independent.out
          grep -qF 'ALL INDEPENDENT CHECKS PASSED' independent.out
      - name: Pure-SSH replay, mutants and exact diagonalisation
        working-directory: records/puressh
        run: |
          set -euo pipefail
          python -B replay.py | tee replay.out
          grep -qF 'ALL EXACT RATIONAL AND OUTWARD INTERVAL CHECKS PASSED' replay.out
          grep -qF 'R_max    = 24718511/9834543 < 3' replay.out
          python -B replay.py --all-mutants | tee mutants.out
          grep -qF 'ALL 12 MATHEMATICAL MUTANTS REJECTED' mutants.out
          python -B ed_check.py | tee ed.out
          grep -qF 'ALL NUMERICAL ED CHECKS PASSED' ed.out
      - name: Uniform ceiling in the Hubbard-Holstein-SSH model and its mutants
        working-directory: records/uniform-ssh
        run: |
          set -euo pipefail
          python -B replay.py | tee replay.out
          grep -qF 'ALL EXACT RATIONAL AND OUTWARD INTERVAL CHECKS PASSED' replay.out
          grep -qF 'b_src = 2737395/3585482 < 1' replay.out
          grep -qF 'Dimer non-monotonicity: CERTIFIED' replay.out
          python -B replay.py --all-mutants | tee mutants.out
          grep -qF 'ALL 8 MATHEMATICAL MUTANTS REJECTED' mutants.out
      - name: Public prose safeguards
        run: |
          set -euo pipefail
          # Only em dashes are banned. En dashes in bibliographic page and issue
          # ranges are reviewed typography and are allowed.
          prose='paper/main.tex README.md BUILD.md CLAIMS.md CITATION.cff'
          if grep -nF '—' $prose; then exit 1; fi
          if grep -nE '\b(BARRIERS2|ADIABATIC|PURESSH|STATIC-MODE|LINEAR-FRESH|SSHBOUND3|EXTHOL|HUBHOL|UNIV-GLUE|MASSIVE)[[:alnum:]_-]*|ceiling-20261118|D:/|C:/|\bMac\b|\blane\b|\bscratch\b|reserved DOI|awaits review' $prose; then exit 1; fi
          grep -qF 'This preprint has not been peer reviewed.' paper/main.tex
          grep -qF 'This preprint has not been peer reviewed.' README.md
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_DATE_EPOCH: "1795132800"
    steps:
      - uses: actions/checkout@v4
      - name: Install Tectonic and poppler
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xz -C /usr/local/bin
          tectonic --version
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Build the manuscript
        working-directory: paper
        run: |
          set -euo pipefail
          tectonic --keep-logs main.tex
          if grep -nE 'Overfull|Underfull|Undefined|Citation.*undefined|There were undefined' main.log; then exit 1; fi
          test -s main.pdf
          sha256sum main.pdf
          pdfinfo -url main.pdf > urls.txt
          grep -qF 'https://orcid.org/0000-0001-5839-5197' urls.txt
          pdftotext main.pdf main.txt
          # Only em dashes are banned; en dashes in bibliographic ranges are allowed.
          if grep -nF '—' main.txt; then exit 1; fi
          if grep -nE '\b(BARRIERS2|ADIABATIC|PURESSH|STATIC-MODE|LINEAR-FRESH|SSHBOUND3|EXTHOL|HUBHOL|UNIV-GLUE|MASSIVE)[[:alnum:]_-]*|ceiling-20261118|D:/|C:/t|\bMac\b|\blane\b|reserved DOI|awaits review' main.txt; then exit 1; fi
          tr -s '[:space:]' ' ' < main.txt | grep -qF 'This preprint has not been peer reviewed.'
          tr -s '[:space:]' ' ' < main.txt | grep -qF 'separate AI agents performed the independent reviews.'
      - uses: actions/upload-artifact@v4
        with:
          name: linear-pairing-ceiling-obstructions-paper
          path: |
            paper/main.pdf
            paper/main.log
            paper/main.tex
            paper/refs.bib
            paper/urls.txt
          if-no-files-found: error
